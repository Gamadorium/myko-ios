workflows:
  ios-testflight:
    name: OLDUSKO iOS TestFlight
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.oldusko.mobileclient
      groups:
        - appstore_credentials
      vars:
        UNITY_IOS_DIR: ios
        XCODE_PROJECT: Unity-iPhone.xcodeproj
        XCODE_SCHEME: Unity-iPhone
      xcode: latest
      cocoapods: default
    scripts:
      - name: Apply App Store signing
        script: xcode-project use-profiles
      - name: Build the ipa
        script: |
          xcode-project build-ipa \
            --project "$UNITY_IOS_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: G9HVGDW8YD
        issuer_id: 69a6de7f-1eab-47e3-e053-5b8c7c11a4d1
        submit_to_testflight: true
